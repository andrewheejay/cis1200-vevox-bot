<!doctype html>
<!-- Trimmed from the Vevox participant page while poll 135 was open (Wed 10/21): the choices sit in the
     right-hand card (x > 770), the sixth below the fold, under the "Profile" pop-up whose button reads "Ok". -->
<html><head><style>
  body { margin: 0; font-family: sans-serif; }
  .left { position: absolute; left: 270px; top: 16px; width: 480px; }
  .right { position: absolute; left: 784px; top: 16px; width: 480px; }
  .v-list-item { height: 60px; margin-bottom: 8px; border: 1px solid #ccc; cursor: pointer; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); }
  .v-card { position: fixed; left: 440px; top: 168px; width: 400px; height: 380px; background: #fff; }
  .v-btn { text-transform: uppercase; }
</style></head><body>
<div class="left"><div>458-974-653</div><p>CIS 1200 - 26fa</p><p>Welcome</p></div>
<div class="right">
  <div>Poll Open</div><h2>Choose...</h2><div style="height: 200px"></div>
  <p data-testid="question-sub-header">Select a choice.</p>
  <div role="listbox" data-testid="question-choice-list">
    <div role="option" aria-selected="false" data-testid="question-choice" class="v-list-item"><p>1</p></div>
    <div role="option" aria-selected="false" data-testid="question-choice" class="v-list-item"><p>2</p></div>
    <div role="option" aria-selected="false" data-testid="question-choice" class="v-list-item"><p>3</p></div>
    <div role="option" aria-selected="false" data-testid="question-choice" class="v-list-item"><p>4</p></div>
    <div role="option" aria-selected="false" data-testid="question-choice" class="v-list-item"><p>5</p></div>
    <div role="option" aria-selected="false" data-testid="question-choice" class="v-list-item"><p>6</p></div>
  </div>
</div>
<div id="profile"><div class="overlay"></div>
  <div class="v-card" data-testid="profile-dialog-identified"><div>Profile</div>
    <button type="button" class="v-btn" onclick="document.getElementById('profile').remove()"><span>Ok</span></button></div></div>
<script>
  for (const c of document.querySelectorAll('[data-testid="question-choice"]'))
    c.addEventListener('click', () => {
      for (const o of document.querySelectorAll('[data-testid="question-choice"]')) o.setAttribute('aria-selected', 'false');
      c.setAttribute('aria-selected', 'true');
    });
</script>
</body></html>
