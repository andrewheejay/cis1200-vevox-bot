[project]
name = "vevoxbot"
version = "0.1.0"
description = "Answers CIS 1200 Vevox polls from the day's lecture slides"
requires-python = ">=3.12"
dependencies = ["playwright>=1.48"]

[project.scripts]
bot = "vevoxbot.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
