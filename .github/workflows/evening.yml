name: evening
on:
  schedule:
    - cron: "17 1 * * 1,3,5"  # 21:17 EDT Sun/Tue/Thu
    - cron: "17 2 * * 1,3,5"  # 21:17 EST
  workflow_dispatch:  # cron-job.org calls this at 9:00 pm ET: GitHub's own schedule runs hours late

permissions:
  contents: write

concurrency:
  group: evening
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -e .
      - name: Is it the evening before class?
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || python -c "import sys, datetime as d; from vevoxbot.gate import should_run_evening; sys.exit(0 if should_run_evening(d.datetime.now(d.timezone.utc)) else 1)"; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"; echo "Not the evening before class; nothing to do."
          fi
      - name: Install browser, pdftotext, Claude Code
        if: steps.gate.outputs.go == 'true'
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -q poppler-utils
          npm install -g @anthropic-ai/claude-code
      - name: Restore Vevox login
        if: steps.gate.outputs.go == 'true'
        env:
          VEVOX_STATE: ${{ secrets.VEVOX_STATE }}
        run: umask 077 && printf '%s' "$VEVOX_STATE" > "$RUNNER_TEMP/state.json"
      - name: Check Vevox login (fails = re-run `bot login --upload` tonight)
        if: steps.gate.outputs.go == 'true'
        env:
          VEVOX_STATE_FILE: ${{ runner.temp }}/state.json
        run: python -m vevoxbot check
      - name: Build tomorrow's answer sheet
        if: always() && steps.gate.outputs.go == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python -m vevoxbot sheet
      - name: Save answer sheet
        if: always() && steps.gate.outputs.go == 'true'
        run: |
          git config user.name "vevox-bot"
          git config user.email "vevox-bot@users.noreply.github.com"
          git add sheets
          git diff --cached --quiet || { git commit -q -m "sheet for next class" && git push -q; }
