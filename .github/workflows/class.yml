name: class
on:
  schedule:
    - cron: "41 13 * * 1,3,5"  # 9:41 EDT
    - cron: "41 14 * * 1,3,5"  # 9:41 EST (10:41 EDT: only runs if the first run didn't)
  workflow_dispatch:
    inputs:
      date:
        description: "Class date to run as (YYYY-MM-DD, blank = today)"
        default: ""
      dry_run:
        description: "Watch only, never click"
        type: boolean
        default: true
      minutes:
        description: "How long a manual run lasts"
        default: "2"

concurrency:
  group: class
  cancel-in-progress: false

jobs:
  answer:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -e .
      - name: Is it class time?
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || python -c "import sys, datetime as d; from vevoxbot.gate import should_run_class; sys.exit(0 if should_run_class(d.datetime.now(d.timezone.utc)) else 1)"; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"; echo "Not class time; nothing to do."
          fi
      - name: Install browser, pdftotext, Claude Code
        if: steps.gate.outputs.go == 'true'
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -q poppler-utils
          npm install -g @anthropic-ai/claude-code
      - name: Restore Vevox login
        if: steps.gate.outputs.go == 'true'
        env:
          VEVOX_STATE: ${{ secrets.VEVOX_STATE }}
        run: umask 077 && printf '%s' "$VEVOX_STATE" > "$RUNNER_TEMP/state.json"
      - name: Answer polls
        if: steps.gate.outputs.go == 'true'
        env:
          VEVOX_STATE_FILE: ${{ runner.temp }}/state.json
          SKIP_DATES: ${{ vars.SKIP_DATES }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          IN_DATE: ${{ inputs.date }}
          IN_DRY: ${{ inputs.dry_run }}
          IN_MINUTES: ${{ inputs.minutes }}
        run: |
          args=()
          if [ "$MANUAL" = "true" ]; then
            args+=(--no-wait); export VEVOXBOT_MINUTES="$IN_MINUTES"
            [ -n "$IN_DATE" ] && args+=(--date "$IN_DATE")
            [ "$IN_DRY" = "true" ] && args+=(--dry-run)
          fi
          python -m vevoxbot run "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.go == 'true'
        with:
          name: run-${{ github.run_id }}
          path: runs/
          if-no-files-found: ignore
